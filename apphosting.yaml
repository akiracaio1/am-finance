
# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # O AM Finance é otimizado para rodar em instâncias escaláveis.
  maxInstances: 5
  minInstances: 0
  memory: 512MiB
  cpu: 1

env:
  - variable: NODE_ENV
    value: production
