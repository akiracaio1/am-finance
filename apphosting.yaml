# Configurações para o Firebase App Hosting (Otimizado para Next.js)
runConfig:
  maxInstances: 5
  minInstances: 0
  memory: 512MiB
  cpu: 1

env:
  - variable: NODE_ENV
    value: production
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "studio-1144915914-4c438"

# Define a região do deploy
location: us-central1
